<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ site.description }}">
<script>
  // Set theme before paint to avoid a flash. Saved choice wins, else follow the OS.
  (function () {
    var t;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">MyResearch<span>Hub</span></a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>피드</a>
      <a href="{{ '/weekly/' | relative_url }}"{% if page.url contains "/weekly/" %} aria-current="page"{% endif %}>주간 리포트</a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="다크/라이트 모드 전환">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
</header>
<main class="{{ page.layout }}">
  {{ content }}
</main>
<footer class="site-footer">
  <p>{{ site.description }}</p>
</footer>
<script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
<script src="{{ '/assets/js/week-label.js' | relative_url }}"></script>
{% if page.layout == "weekly-report" %}
<script src="{{ '/assets/js/weekly-report.js' | relative_url }}"></script>
{% else %}
<script src="{{ '/assets/js/weeks.js' | relative_url }}"></script>
<script src="{{ '/assets/js/filter.js' | relative_url }}"></script>
{% endif %}
</body>
</html>
