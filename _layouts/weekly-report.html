---
layout: default
---
<div class="report">
  <aside class="report-toc" id="report-toc">
    <a class="toc-back" href="{{ '/weekly/' | relative_url }}">← 전체 리포트</a>
    <div class="toc-label">목차</div>
    <nav id="toc-list"></nav>
  </aside>
  <article class="report-body">
    <header class="report-head">
      <div class="eyebrow">주간 리서치 리포트 · {{ page.date | date: "%Y.%m.%d" }}</div>
      <h1 class="weekly-title">{{ page.title }}</h1>
    </header>
    <div id="weekly-highlights" class="weekly-highlights"></div>
    <div id="weekly-content" class="weekly-content">
      {{ content }}
    </div>
  </article>
</div>
